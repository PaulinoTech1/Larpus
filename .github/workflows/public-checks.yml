name: Public checkout checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkout-contracts:
    name: Public contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      LARPUS_ISOLATION: host
      OLLAMA_NO_CLOUD: '1'
      OTEL_SDK_DISABLED: 'true'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      # Bounded CI-only DLP ACL-helper timeout (runtime.dlp caps it at 60 s; ignored outside GitHub Actions).
      LARPUS_CI_QUARANTINE_TIMEOUT: '60'
    steps:
      - name: Checkout public source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Python 3.10 (owner gateway compatibility)
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.10'
      - name: Node 24 (HUD logic)
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Check public file boundary before installing
        run: python scripts/ci.py --inventory-only
      - name: Install public test dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Vendor frontend assets (KaTeX)
        run: |
          npm ci
          npm run vendor
      - name: TEMPORARY diagnostic - PowerShell launch timing from piped child (Windows)
        if: runner.os == 'Windows'
        run: python scripts/ci_diag_ps_launch.py
      - name: Pre-apply quarantine ACL (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          # Stable CI quarantine honoured by runtime.dlp only when GITHUB_ACTIONS=true.
          # Run the same helper the gate uses twice: proves idempotency and warms
          # Windows PowerShell/.NET before the console-less MCP child calls it.
          $dir = Join-Path $env:RUNNER_TEMP 'larpus-quarantine'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $ps = Join-Path $env:SYSTEMROOT 'System32\WindowsPowerShell\v1.0\powershell.exe'
          foreach ($pass in 1, 2) {
            $timer = [Diagnostics.Stopwatch]::StartNew()
            & $ps -NoProfile -NonInteractive -File scripts\protect-quarantine.ps1 -Target $dir
            if ($LASTEXITCODE -ne 0) { throw "protect-quarantine.ps1 failed on pass $pass" }
            "protect-quarantine pass $pass took $([math]::Round($timer.Elapsed.TotalSeconds, 2)) s"
          }
          # .NET appends UTF-8 without a BOM (Windows PowerShell's utf8 Out-File adds one).
          [IO.File]::AppendAllText($env:GITHUB_ENV, "LARPUS_CI_QUARANTINE_DIR=$dir`n")
      - name: Run public contracts and synthetic evaluations
        run: python scripts/ci.py
