name: Public checkout checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkout-contracts:
    name: Public contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      LARPUS_ISOLATION: host
      OLLAMA_NO_CLOUD: '1'
      OTEL_SDK_DISABLED: 'true'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Checkout public source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Python 3.10 (owner gateway compatibility)
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.10'
      - name: Node 24 (HUD logic)
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Check public file boundary before installing
        run: python scripts/ci.py --inventory-only
      - name: Install public test dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Vendor frontend assets (KaTeX)
        run: |
          npm ci
          npm run vendor
      - name: Diagnose quarantine ACL hardening (TEMPORARY)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -c "import os, subprocess, tempfile; from pathlib import Path; d=Path(tempfile.mkdtemp()); print('target:', d); exe=Path(os.environ['SYSTEMROOT'])/'System32/WindowsPowerShell/v1.0/powershell.exe'; print('exe exists:', exe.exists()); r=subprocess.run([str(exe),'-NoProfile','-NonInteractive','-ExecutionPolicy','Bypass','-File','scripts/protect-quarantine.ps1','-Target',str(d)],capture_output=True,text=True,timeout=60); print('rc:', r.returncode); print('stdout tail:', r.stdout[-300:]); print('stderr tail:', r.stderr[-1500:])"
      - name: Run public contracts and synthetic evaluations
        run: python scripts/ci.py
